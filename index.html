  <style>
    :root { --bg:#f6f7f9; --ink:#111; --muted:#666; --card:#fff; --border:#a1a4aa; --accent:#e11d1d; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 'Exo', system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Arial; font-weight:300; }
    header { padding:16px 20px; background:#111; color:#fff; position:relative; display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:12px; }
    .header-content { flex:1; display:flex; flex-direction:column; gap:4px; min-width:260px; }
    header h1 { margin:0; font-size:20px; font-weight:600; letter-spacing:.5px; }
    header .hint { color:#c9ccd1; font-size:12px; }
    #language-selector { display:flex; align-items:center; gap:8px; flex-shrink:0; }
    #language-selector > div > span { font-size:12px; color:#fff; }

    /* Customized dropdown */
    .custom-select-wrapper { position:relative; width:160px; }
    .custom-select-button {
      width:100%; border:1px solid #d9dde3; border-radius:10px; padding:8px 12px;
      background:#fff; color:#111 !important; display:flex; align-items:center;
      justify-content:space-between; gap:8px; cursor:pointer; transition:background .15s;
      font-family:'Exo', system-ui; font-weight:300; font-size:12px;
    }
    .custom-select-button:hover { background:#f6f7f9; }
    .custom-select-label { display:flex; align-items:center; gap:8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#111 !important; }
    .custom-select-arrow { width:16px; height:16px; opacity:.7; flex-shrink:0; }
    .custom-select-menu {
      position:absolute; z-index:2000; margin-top:4px; width:100%; max-height:260px; overflow:auto;
      border-radius:10px; border:1px solid #d9dde3; background:#fff; box-shadow:0 6px 18px rgba(0,0,0,.1); display:none;
    }
    .custom-select-menu.open { display:block; }
    .custom-select-option {
      width:100%; text-align:left; padding:8px 12px; cursor:pointer; transition:background .15s;
      display:flex; align-items:center; gap:8px; font-size:12px; color:#111 !important;
      border:none; background:none; font-family:inherit;
    }
    .custom-select-option:hover { background:#f6f7f9; }
    .custom-select-option.selected { background:#e9ecef; }
    .flag-icon { width:24px; height:18px; object-fit:contain; display:inline-block; }

    main { padding:16px 20px 32px; max-width:1400px; margin:0 auto; }
    .card { background:var(--card); border-radius:14px; box-shadow:0 6px 18px rgba(0,0,0,.06); padding:16px; margin-bottom:16px; border:1px solid var(--border); }
    .card h2 { margin:0 0 12px; font-size:15px; font-weight:600; text-transform:uppercase; letter-spacing:1px; }
    .row { display:flex; gap:16px; flex-wrap:wrap; }
    .col { flex:1 1 320px; min-width:0; }
    .col-narrow { flex:1 1 180px; min-width:0; }
    label { display:block; font-size:13px; margin-bottom:6px; color:#000; font-weight:600; }
    input[type="text"], input[type="number"], select, textarea {
      width:100%; padding:10px 12px; border:1px solid #d9dde3; border-radius:10px;
      font-family:inherit; font-size:14px; background:#fff; color:#111;
    }
    .dropzone {
      width:100%; border:2px dashed #c7ccd3; border-radius:12px; background:#fbfcfd;
      padding:22px 16px; cursor:pointer; font-family:inherit; color:inherit;
      display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center;
      transition:border-color .15s, background .15s, color .15s;
    }
    .dropzone:hover, .dropzone:focus-visible { border-color:#111; background:#f2f4f7; outline:none; }
    .dropzone.over { border-color:var(--accent); background:#fdf1f1; }
    .dropzone svg { width:42px; height:42px; color:#8b9099; transition:color .15s; }
    .dropzone:hover svg { color:#111; }
    .dropzone.over svg { color:var(--accent); }
    .dz-title { font-size:14px; font-weight:600; }
    .dz-sub { font-size:12px; color:#666; }
    .dz-file { font-size:12px; font-weight:600; color:#111; word-break:break-all; }
    textarea { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; resize:vertical; }
    .field { margin-bottom:14px; }
    .checkline { display:flex; align-items:center; gap:8px; margin-bottom:10px; font-size:13px; font-weight:600; }
    .checkline input { width:16px; height:16px; }
    .checkline label { margin:0; }
    .controls { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
    .btn { padding:10px 16px; border:1px solid #111; border-radius:10px; background:#111; color:#fff; cursor:pointer; font-family:inherit; font-size:14px; font-weight:600; }
    .btn:hover:not(:disabled) { background:#333; }
    .btn.secondary { background:#fff; color:#111; }
    .btn.secondary:hover:not(:disabled) { background:#f0f0f0; }
    .btn.danger { background:var(--accent); border-color:var(--accent); }
    .btn:disabled { opacity:.45; cursor:not-allowed; }
    .hint { font-size:12px; color:#555; font-weight:300; }
    .tabs { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
    .tab { padding:10px 18px; border:1px solid var(--border); border-radius:999px; background:#fff; color:#111; cursor:pointer; font-family:inherit; font-size:14px; font-weight:600; }
    .tab.active { background:#111; color:#fff; border-color:#111; }
    .previewWrap { border:1px solid var(--border); border-radius:12px; background:#fff; padding:8px; display:flex; align-items:center; justify-content:center; overflow:hidden; }
    .previewWrap svg { width:100%; height:auto; display:block; max-height:70vh; }
    .stat { display:flex; justify-content:space-between; gap:12px; padding:7px 0; border-bottom:1px dashed #e3e5e8; font-size:13px; }
    .stat:last-child { border-bottom:none; }
    .stat b { font-weight:600; }
    .alert { padding:10px 14px; border-radius:10px; font-size:13px; margin-bottom:12px; border:1px solid; font-weight:600; }
    .alert.warn { background:#fff8e6; border-color:#e6c14d; color:#7a5a00; }
    .alert.err { background:#fdecec; border-color:#e79a9a; color:#8d1c1c; }
    .alert.ok { background:#eaf7ee; border-color:#8fcf9f; color:#1d6b32; }
    .canvasWrap { position:relative; border:1px solid var(--border); border-radius:12px; overflow:hidden; background:#fff; aspect-ratio:1; }
    .canvasWrap canvas { width:100%; height:100%; display:block; }
    .canvasWrap.framing canvas { cursor:grab; touch-action:none; }
    .canvasWrap.framing canvas:active { cursor:grabbing; }
    .caption { font-size:12px; font-weight:600; margin-bottom:6px; }
    .zoombar { display:flex; align-items:center; gap:8px; margin:8px 0 6px; flex-wrap:wrap; }
    .zoombtn {
      width:30px; height:30px; flex-shrink:0; padding:0; display:flex; align-items:center; justify-content:center;
      border:1px solid var(--border); border-radius:8px; background:#fff; color:#111;
      cursor:pointer; font-family:inherit; font-size:17px; font-weight:600; line-height:1;
    }
    .zoombtn:hover:not(:disabled) { background:#f0f0f0; }
    .zoombtn:disabled { opacity:.45; cursor:not-allowed; }
    .zoomval { font-size:12px; font-weight:600; min-width:46px; text-align:center; }
    .btn.small { padding:6px 12px; font-size:12px; border-radius:8px; }
    /* The box keeps the layout steady while the stage itself pops out of the
       flow to cover the window. */
    .stageBox { position:relative; aspect-ratio:16/10; }
    .stage3d {
      position:absolute; inset:0; border:1px solid var(--border); border-radius:12px; overflow:hidden;
      background:#eef0f3; touch-action:none; cursor:grab;
    }
    .stage3d.max { position:fixed; inset:12px; z-index:3000; box-shadow:0 24px 60px rgba(0,0,0,.28); }
    .stage3d:active { cursor:grabbing; }
    .stage3d canvas { width:100%; height:100%; display:block; }
    .stageBackdrop { position:fixed; inset:0; background:rgba(17,17,17,.55); z-index:2900; }
    .expand {
      position:absolute; top:10px; right:10px; width:34px; height:34px; padding:0; border-radius:50%;
      display:flex; align-items:center; justify-content:center; cursor:pointer;
      border:1px solid rgba(0,0,0,.18); background:rgba(255,255,255,.92); color:#111;
      box-shadow:0 2px 6px rgba(0,0,0,.14); transition:background .15s;
    }
    .expand:hover { background:#fff; }
    .expand svg { width:18px; height:18px; }
    .swatch { display:flex; align-items:center; gap:10px; }
    .swatch input[type="color"] {
      width:44px; height:34px; padding:2px; border:1px solid #d9dde3; border-radius:8px;
      background:#fff; cursor:pointer; flex-shrink:0;
    }
    .swatch code { font-size:12px; font-weight:600; text-transform:uppercase; }
    .segmented { display:flex; gap:0; border:1px solid var(--border); border-radius:10px; overflow:hidden; }
    .segmented button {
      flex:1; padding:9px 10px; border:none; background:#fff; color:#111; cursor:pointer;
      font-family:inherit; font-size:13px; font-weight:600;
    }
    .segmented button + button { border-left:1px solid var(--border); }
    .segmented button.on { background:#111; color:#fff; }
    .progress { height:22px; background:#e9ecef; border-radius:999px; overflow:hidden; border:1px solid var(--border); }
    .progress > div { height:100%; background:#111; color:#fff; font-size:11px; display:flex; align-items:center; justify-content:center; transition:width .1s linear; }
    footer { padding:12px 20px 24px; text-align:center; color:#444; font-size:12px; }
    footer a { color:#111; }
    .grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:0 16px; }
  </style>

  <script id="template-engine">
    // ---------------------------------------------------------------
    // Template engine
    //
    // The whole drawing is defined in "design units" where the circle
    // radius is exactly 90 u, which is the proportion system used by the
    // reference A0 template. Every derived measure is a fixed ratio of the
    // radius, so a template keeps the same look at any physical size.
    // ---------------------------------------------------------------

            // nudged sideways, and set to read outwards from the centre.
            ax: px + ca * labelRadial - sa * labelBaseline,
            ay: py + sa * labelRadial + ca * labelBaseline,

        // labelled points, measured on the ring they sit on, drops below the
        // height of a digit.

          labelEvery: labelEvery,

          cx: cx, cy: cy,
          circleStroke: D.circleStroke * u,

          if (p.labelled) {
            s.push('<text x="' + fmt(p.ax) + '" y="' + fmt(p.ay) + '" transform="rotate(' + fmt(p.deg) + ' ' +

          }
        }

        s.push('</svg>');
        return s.join('\n');
      }

      // jsPDF's own circle() approximates with 4 Bézier segments, which is
      // ~0.03% off — visible as a fraction of a millimetre on an A0 template.
      function strokeCircle(doc, cx, cy, r, segments) {

        var a = 2 * Math.PI / n;

            r * (c0 - k * s0) - p0x, r * (s0 + k * c0) - p0y,
            r * (c1 + k * s1) - p0x, r * (s1 - k * c1) - p0y,
            r * c1 - p0x, r * s1 - p0y

          orientation: L.pageW > L.pageH ? 'landscape' : 'portrait',

          doc.rect(h, h, L.pageW - L.borderStroke, L.pageH - L.borderStroke, 'S');

        if (L.showFrame) {
          doc.setLineWidth(L.borderStroke);
          doc.rect(L.cx - L.frameHalf, L.cy - L.frameHalf, 2 * L.frameHalf, 2 * L.frameHalf, 'S');
        }
        if (L.showCenter) {
          var m = L.frameHalf * 0.04;
          doc.setLineWidth(L.borderStroke);
          doc.line(L.cx - m, L.cy, L.cx + m, L.cy);
          doc.line(L.cx, L.cy - m, L.cx, L.cy + m);
        }

        doc.setLineWidth(L.circleStroke);
        strokeCircle(doc, L.cx, L.cy, L.R, 128);

        doc.setFillColor(255, 0, 0);
        for (var i = 0; i < L.pts.length; i++) {

    // ---------------------------------------------------------------
    // Printable nail ring
    //
    // The part that replaces a drilled board: a flat band centred on the point
    // circle carrying one cylindrical nail per point. A ring too wide for the
    // print bed can be cut into arcs that clip together with puzzle joints, and
    // every point can carry a snap-off tag stamped with its number.

        curlTip: 0.72,     // how much a curl thins towards its tip
        curlSteps: 10,     // sections around the bend

        jointMax: 8,       // longest tab worth cutting, mm

      function computePart(o) {
        var points = Math.max(2, Math.round(num(o.points, 288)));
        var R = Math.max(1, num(o.radiusCm, 28) * 10);
        var ringW = Math.max(1, num(o.ringW, D.ringW));
        var ringH = Math.max(0.6, num(o.ringH, D.ringH));
        var nailD = Math.max(0.4, num(o.nailD, D.nailD));
        var nailH = Math.max(1, num(o.nailH, D.nailH));
        var shape = o.nailShape === 'curl' || o.nailShape === 'cone' ? o.nailShape : 'straight';
        // Never more arcs than points, or an arc would come out with no nail on
        // it and no band to speak of.
        var segments = Math.round(clamp(num(o.segments, D.segments), 1, Math.min(24, points)));
        var clearance = clamp(num(o.clearance, D.clearance), 0.05, 1);
        var arrows = !!o.arrows;

        // The band straddles the point circle, so the thread still runs at
        // exactly the radius the drilling template is built for.
        var ri = Math.max(0.5, R - ringW / 2), ro = R + ringW / 2;
        var spacing = 2 * Math.PI * R / points;

        // A finished loop escapes over the tip, so both shaped nails make the
        // top harder to leave than the shaft: a curl hangs over the thread, a
        // cone simply outgrows it. Whichever end is widest is the one the
        // neighbouring nails have to leave room for.
        var tipD = nailD * (shape === 'cone' ? D.coneTip : (shape === 'curl' ? D.curlTip : 1));
        var wide = Math.max(nailD, tipD);

        // A curl climbs, then turns outwards over its own base. Turning past a
        // quarter circle means the crown of the bend, not the tip, is the
        // highest thing on the nail, and it rides one tube radius above the
        // centre line: that comes off the height first, so a curl still stands
        // exactly as tall as the straight nail it replaces.
        var bend = D.curlBend * Math.PI / 180;
        var crownR = nailD / 2 * (1 + (D.curlTip - 1) * 0.9);
        var room = Math.max(nailD * 0.3, nailH - crownR);
        // The radius of the turn is kept above the nail's own so the inside of
        // the bend cannot fold through itself.
        var curlRad = Math.min(Math.max(room * (1 - D.curlRise), nailD * 0.6), room * 0.8);
        var curl = {
          rad: curlRad, rise: Math.max(0, room - curlRad),
          bend: bend, steps: D.curlSteps,
          // How far the hook hangs past the nail axis, which is what a loop of
          // thread has to climb over. The tip is tilted by then, so only part
          // of its own radius counts.
          reach: curlRad * (1 - Math.cos(bend)) + tipD / 2 * Math.abs(Math.cos(bend))

        // A joint has to fit in the gap between two nails, because both of them
        // still need full-width band to stand on. The head must also leave a
        // prong on either side of it that is worth printing.
        var jointLen = Math.max(0, Math.min(D.jointMax, spacing - nailD - 2 * D.jointKeep - clearance));

        var neckHalf = headHalf * 0.55;

        // its neck, there is nothing left to grip with: the arcs then get a
        // square cut and have to be glued.

        // Tags hang off the outer wall, so the room left by their neighbours
        // decides how wide they are, and that in turn sizes the digits.
        var tagW = Math.min(spacing * 0.86, D.tagMax);
        var shaft = tagW * 0.72;
        var digitH = Math.max(1.2, shaft - 1);
        var digitW = digitH * 0.6;
        var count = String(points - 1).length;
        var headLen = Math.min(4, tagW * 0.8);
        var text = count * digitW + (count - 1) * digitW * 0.3;

        return {
          points: points, R: R, ri: ri, ro: ro,
          ringW: ringW, ringH: ringH, nailD: nailD, nailH: nailH,
          segments: segments, clearance: clearance, arrows: arrows,
          nailShape: shape, tipD: tipD, curl: curl,
          sides: D.nailSides,
          steps: Math.min(1440, Math.max(180, Math.round(2 * Math.PI * R / D.facet))),
          spacing: spacing,
          gap: spacing - wide,
          height: ringH + nailH,
          jointLen: jointLen, headHalf: headHalf, neckHalf: neckHalf,
          jointFits: jointFits,
          // How much band each arc gives up at a cut, measured along the ring.
          jointHalf: jointFits ? (jointLen + clearance) / 2 : clearance / 2,
          tag: {
            w: tagW, shaft: shaft, headLen: headLen, text: text,
            len: headLen + text + 2,
            digitH: digitH, digitW: digitW,
            stroke: Math.max(0.45, digitH * 0.2),
            // A tag never stands taller than the band it hangs off.
            plate: Math.min(D.tagPlate, ringH)

          // Digits thinner than this stop being either legible or printable.
          tagsFit: digitH >= 2.2

      }

      // Growable triangle soup, plus the few shapes everything here is made of.
      function soup() {
        var v = new Float32Array(1 << 15), n = 0;

        function room(k) {
          if (n + k <= v.length) return;
          var size = v.length;
          while (size < n + k) size *= 2;
          var bigger = new Float32Array(size);
          bigger.set(v.subarray(0, n));

        }
        function tri(a, b, c) {
          room(9);
          v[n] = a[0]; v[n + 1] = a[1]; v[n + 2] = a[2];
          v[n + 3] = b[0]; v[n + 4] = b[1]; v[n + 5] = b[2];
          v[n + 6] = c[0]; v[n + 7] = c[1]; v[n + 8] = c[2];

        // Wound counter-clockwise seen from outside, which is what STL readers
        // use to tell solid from void.
        function quad(a, b, c, d) { tri(a, b, c); tri(a, c, d); }

        // A prism over a closed counter-clockwise outline, used for everything
        // flat: the tags and the digits stamped on them. The outline has to be
        // convex, so anything else is assembled from several overlapping ones.
        function plate(poly, z0, z1) {
          var m = poly.length, i, p0 = poly[0];
          for (i = 1; i < m - 1; i++) {

            tri([p0[0], p0[1], z1], [a[0], a[1], z1], [b[0], b[1], z1]);
            tri([p0[0], p0[1], z0], [b[0], b[1], z0], [a[0], a[1], z0]);
          }
          for (i = 0; i < m; i++) {
            var s = poly[i], e = poly[(i + 1) % m];

          }

        // A prism swept round the axis, given a radial interval per angular
        // sample. Constant radii give the band; varying ones give the joints.
        function sweep(samples, z0, z1, closed) {

          for (i = 0; i < m; i++) {

            var A = samples[i], B = samples[j];
            var ia = [A.rIn * A.c, A.rIn * A.s], oa = [A.rOut * A.c, A.rOut * A.s];
            var ib = [B.rIn * B.c, B.rIn * B.s], ob = [B.rOut * B.c, B.rOut * B.s];
            quad([ia[0], ia[1], z1], [oa[0], oa[1], z1], [ob[0], ob[1], z1], [ib[0], ib[1], z1]);
            quad([ib[0], ib[1], z0], [ob[0], ob[1], z0], [oa[0], oa[1], z0], [ia[0], ia[1], z0]);
            quad([oa[0], oa[1], z0], [ob[0], ob[1], z0], [ob[0], ob[1], z1], [oa[0], oa[1], z1]);
            quad([ib[0], ib[1], z0], [ia[0], ia[1], z0], [ia[0], ia[1], z1], [ib[0], ib[1], z1]);
          }
          if (closed) return;
          var F = samples[0], L = samples[m - 1];
          quad([F.rIn * F.c, F.rIn * F.s, z0], [F.rOut * F.c, F.rOut * F.s, z0],
               [F.rOut * F.c, F.rOut * F.s, z1], [F.rIn * F.c, F.rIn * F.s, z1]);
          quad([L.rIn * L.c, L.rIn * L.s, z1], [L.rOut * L.c, L.rOut * L.s, z1],

        return {

        };
      }

      // Wrapping with a modular index rather than an extra table entry keeps a
      // closing seam on the very same numbers, so the solid ends up watertight
      // down to the last bit.
      function wheel(n) {

      function loop(w, rIn, rOut) {

        // shaft vertically and ends up hanging over it.

            // while its other axis stays along the ring.
            e1: [co * u[0] - si * up[0], co * u[1] - si * up[1], co * u[2] - si * up[2]],

      // Half-width of the tab at distance u from where the band ends: a straight
      // neck, then a head that swells past it and closes again, so the two
      // halves cannot be pulled apart along the ring.
      function tabHalf(P, u) {

      // beyond the tip.

          var a = cut - half + x / P.R, co = Math.cos(a), si = Math.sin(a);

        for (i = 0; i <= N; i++) at(c + (last - c) * i / N);

        s.sweep(inner, 0, P.ringH, false);

      // A pointer aimed at its nail, stamped with the point number and joined to

      function tag(s, P, angle, label) {

        var c = Math.cos(angle), si = Math.sin(angle);
        function at(u, w) { return [c * u - si * w, si * u + c * w]; }

        var head = P.ro + T.headLen, tip = P.ro + T.len;
        var z1 = T.plate;

        s.plate([at(P.ro - D.weld, -root), at(head, -T.w / 2), at(head, T.w / 2), at(P.ro - D.weld, root)], 0, z1);
        s.plate([at(head - 0.4, -T.shaft / 2), at(tip, -T.shaft / 2), at(tip, T.shaft / 2), at(head - 0.4, T.shaft / 2)], 0, z1);

        var text = String(label);

        for (var d = 0; d < text.length; d++) {

              at(bu + r[2], r[3] - T.digitH / 2), at(bu + r[0], r[3] - T.digitH / 2)

      // Measured as the part would sit on the bed: turned so its arc straddles

      function frame(v, mid) {

                  v[i + 1] * (v[i + 3] * v[i + 8] - v[i + 5] * v[i + 6]) +
                  v[i + 2] * (v[i + 3] * v[i + 7] - v[i + 4] * v[i + 6])) / 6;

      function build(P, n0, n1, split) {

        if (split) {

          // its leading end and the matching slot at the other.
          var low = (n0 - 0.5) * step, high = (n1 - 0.5) * step;
          var half = P.jointHalf / P.R;

          s.sweep(span(a0, a1, P.ri, P.ro, Math.max(2, Math.round((a1 - a0) * P.R / D.facet))),
            0, P.ringH, false);
          if (P.jointFits) {

            slot(s, P, low, half);

          s.sweep(loop(wheel(P.steps), P.ri, P.ro), 0, P.ringH, true);

        for (i = n0; i < n1; i++) {
          var a = i * step;
          nail(s, P, P.R * Math.cos(a), P.R * Math.sin(a), nailWheel);

        var v = s.done();

            Math.round(k * P.points / P.segments),
            Math.round((k + 1) * P.points / P.segments), true));

      function placed(part) {

          out[i + 1] = p.s * v[i] + p.c * v[i + 1] - p.dy;

      // Binary STL: an 80-byte free-form header, the triangle count, then 50

      function toStl(v) {
        var n = v.length / 9;

        // Anything but a leading "solid", which would make readers parse the
        // file as ASCII.
        var label = 'String art nail ring (mm)';
        for (var c = 0; c < label.length; c++) dv.setUint8(c, label.charCodeAt(c));
        dv.setUint32(80, n, true);

        var off = 84;
        for (var i = 0; i < n; i++) {
          var p = i * 9;
          var ux = v[p + 3] - v[p], uy = v[p + 4] - v[p + 1], uz = v[p + 5] - v[p + 2];
          var wx = v[p + 6] - v[p], wy = v[p + 7] - v[p + 1], wz = v[p + 8] - v[p + 2];

      var stRun = React.useState(false); var running = stRun[0], setRunning = stRun[1];
      var stMsg = React.useState(''); var msg = stMsg[0], setMsg = stMsg[1];
      var stPct = React.useState(0); var pct = stPct[0], setPct = stPct[1];
      var stSeq = React.useState(null); var seq = stSeq[0], setSeq = stSeq[1];
      // Pin count the current sequence was solved with, which is what the
      // summary and the 3D view have to use rather than the live field value.
      var stRan = React.useState(0); var runPins = stRan[0], setRunPins = stRan[1];
      var stCopied = React.useState(false); var copied = stCopied[0], setCopied = stCopied[1];
      var stName = React.useState(''); var fileName = stName[0], setFileName = stName[1];

      var srcRef = React.useRef(null), outRef = React.useRef(null);
      var workerRef = React.useRef(null), drawRef = React.useRef({ pin: 0, coords: null });
      var dragRef = React.useRef(null);

      var pins = o.sync ? props.points : o.pins;

      React.useEffect(function () {
        return function () { if (workerRef.current) workerRef.current.terminate(); };
      }, []);

      // The preview stays in colour while the framing is being chosen; only
      // pressing Generate greyscales it.
      React.useEffect(function () {
        if (!imgEl || !srcRef.current) return;
        var cv = srcRef.current;
        cv.width = cv.height = PREVIEW;
        var ctx = cv.getContext('2d', { willReadFrequently: true });
        drawFrame(ctx, imgEl, PREVIEW, view);
        maskCircle(ctx, PREVIEW);
        // Outline the reachable area, which is otherwise invisible once the
        // photo is zoomed out far enough not to touch it.
        ctx.beginPath();
        ctx.arc(PREVIEW / 2, PREVIEW / 2, PREVIEW / 2 - 1, 0, 2 * Math.PI);
        ctx.strokeStyle = 'rgba(0,0,0,0.28)';
        ctx.lineWidth = 2;
        ctx.stroke();
        setGrayed(false);
      }, [imgEl, view]);

      React.useEffect(function () {
        if (imgEl) resetOutput();
      }, [imgEl]);

      // Registered by hand because React makes wheel listeners passive, which
      // would let the page scroll instead of zooming.
      React.useEffect(function () {
        var cv = srcRef.current;
        if (!cv || !imgEl) return;
        function onWheel(e) {
          e.preventDefault();
          var b = cv.getBoundingClientRect();
          var factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
          var fx = (e.clientX - b.left) / b.width, fy = (e.clientY - b.top) / b.height;
          setView(function (v) { return zoomedView(imgEl, v, factor, fx, fy); });
        }
        cv.addEventListener('wheel', onWheel, { passive: false });
        return function () { cv.removeEventListener('wheel', onWheel); };
      }, [imgEl]);

      function onFile(f) {
        var image = new Image();
        image.onload = function () {
          setSeq(null);
          setFileName(f.name);
          setView({ zoom: 1, panX: 0, panY: 0 });
          setImgEl(image);
          URL.revokeObjectURL(image.src);
        };
        image.src = URL.createObjectURL(f);
      }

      function zoom(factor) {
        if (imgEl) setView(function (v) { return zoomedView(imgEl, v, factor, 0.5, 0.5); });
      }

      function onPointerDown(e) {
        if (!imgEl) return;
        var box = e.currentTarget.getBoundingClientRect();
        e.currentTarget.setPointerCapture(e.pointerId);
        dragRef.current = { x: e.clientX, y: e.clientY, width: box.width };
      }

      function onPointerMove(e) {
        var drag = dragRef.current;
        if (!drag || !imgEl) return;
        var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
        drag.x = e.clientX; drag.y = e.clientY;
        setView(function (v) {
          var perPixel = Math.min(imgEl.width, imgEl.height) / v.zoom / drag.width;
          return clampView(imgEl, { zoom: v.zoom, panX: v.panX - dx * perPixel, panY: v.panY - dy * perPixel });
        });
      }

      function onPointerUp(e) {
        dragRef.current = null;
        if (e.currentTarget.hasPointerCapture(e.pointerId)) e.currentTarget.releasePointerCapture(e.pointerId);
      }

      function resetOutput() {
        var cv = outRef.current;
        cv.width = cv.height = DISPLAY;
        var ctx = cv.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, DISPLAY, DISPLAY);
        ctx.strokeStyle = 'rgba(0,0,0,0.32)';
        ctx.lineWidth = Math.max(0.5, DISPLAY / 1400);
        ctx.lineCap = 'round';
      }

      function start() {
        if (!imgEl) { alert(t('errorNoImage')); return; }
        if (workerRef.current) workerRef.current.terminate();

        var size = Math.max(100, Math.min(1200, parseInt(o.size, 10) || 500));

        // Freeze the chosen framing: the solver gets it at the working
        // resolution, the preview shows the same thing at preview resolution.
        var work = document.createElement('canvas');
        work.width = work.height = size;
        var wctx = work.getContext('2d', { willReadFrequently: true });
        drawFrame(wctx, imgEl, size, view);
        var gray = toGrayscale(wctx, size);

        var pv = srcRef.current;
        pv.width = pv.height = PREVIEW;
        var pctx = pv.getContext('2d', { willReadFrequently: true });
        drawFrame(pctx, imgEl, PREVIEW, view);
        toGrayscale(pctx, PREVIEW);
        setGrayed(true);

        var np = Math.max(8, Math.min(1000, parseInt(pins, 10) || 288));
        setRunPins(np);
        var scale = DISPLAY / size;
        var coords = [];
        var c = size / 2, r = size / 2 - 0.5;
        for (var i = 0; i < np; i++) {
          var a = 2 * Math.PI * i / np;
          coords.push([Math.floor(c + r * Math.cos(a)) * scale, Math.floor(c + r * Math.sin(a)) * scale]);
        }
        drawRef.current = { pin: 0, coords: coords };

        resetOutput();
        setSeq(null); setRunning(true); setPct(0); setMsg(t('preparing'));

        var w = makeWorker();
        workerRef.current = w;
        w.onmessage = function (ev) {
          var d = ev.data;
          if (d.type === 'precalc') {
            setPct(0); setMsg(t('precalc', d.value));
          } else if (d.type === 'lines') {
            var ctx = outRef.current.getContext('2d');
            var st = drawRef.current;
            ctx.beginPath();
            for (var k = 0; k < d.pins.length; k++) {
              ctx.moveTo(st.coords[st.pin][0], st.coords[st.pin][1]);
              ctx.lineTo(st.coords[d.pins[k]][0], st.coords[d.pins[k]][1]);
              st.pin = d.pins[k];
            }
            ctx.stroke();
            setPct(Math.round(d.drawn / d.total * 100));
            setMsg(t('linesDrawn', d.drawn, Math.round(d.drawn / d.total * 100)));
          } else if (d.type === 'done') {
            setSeq(d.sequence); setRunning(false); setPct(100); setMsg(t('done'));
            w.terminate(); workerRef.current = null;
          } else if (d.type === 'error') {
            setRunning(false); setMsg('');
            alert(t('errorTooBig'));
            w.terminate(); workerRef.current = null;
          }
        };
        w.postMessage({
          cmd: 'run', gray: gray, size: size, pins: np,
          lines: Math.max(1, Math.min(20000, parseInt(o.lines, 10) || 3000)),
          lineWeight: Math.max(1, parseInt(o.lineWeight, 10) || 20),
          minDistance: Math.max(1, Math.min(Math.floor(np / 3), parseInt(o.minDistance, 10) || 20))
        });
      }

      function stop() {
        if (workerRef.current) { workerRef.current.terminate(); workerRef.current = null; }
        setRunning(false); setMsg('');
      }

      var threadM = React.useMemo(function () {
        if (!seq || !runPins) return 0;
        var R = props.radiusCm * 10, sum = 0;
        for (var i = 1; i < seq.length; i++) {
          var da = Math.abs(seq[i] - seq[i - 1]) * 2 * Math.PI / runPins;
          sum += 2 * R * Math.abs(Math.sin(da / 2));
        }
        return sum / 1000;
      }, [seq, props.radiusCm, runPins]);

      function copySeq() {
        var text = seq.join(',');
        var done = function () {
          setCopied(true); setTimeout(function () { setCopied(false); }, 1500);
        };
        if (navigator.clipboard) {
          navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text, done); });
        } else {
          fallbackCopy(text, done);
        }
      }
      function fallbackCopy(text, done) {
        var ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); done(); } catch (e) { /* clipboard unavailable */ }
        document.body.removeChild(ta);
      }
      function saveTxt() {
        download(new Blob([seq.join(',')], { type: 'text/plain' }), 'string-art-sequence.txt');
      }
      function savePng() {
        outRef.current.toBlob(function (b) { download(b, 'string-art.png'); });
      }
      function saveStepsPdf() {
        var jsPDF = window.jspdf && window.jspdf.jsPDF;
        if (!jsPDF) { alert(t('errorJsPDF')); return; }
        var doc = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait', compress: true });
        var W = 210, H = 297, top = 26, bottom = 16, cols = 5;
        var colW = (W - 24) / cols, lineH = 4.4;
        var perCol = Math.floor((H - top - bottom) / lineH), perPage = perCol * cols;
        var totalSteps = seq.length - 1;
        var pages = Math.max(1, Math.ceil(totalSteps / perPage));

        for (var p = 0; p < pages; p++) {
          if (p) doc.addPage();
          doc.setFont('helvetica', 'bold'); doc.setFontSize(14); doc.setTextColor(0);
          doc.text(t('pdfStepsTitle'), 12, 14);
          doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(90);
          doc.text(t('pdfStepsSubtitle', runPins, totalSteps, n1(props.radiusCm)), 12, 19.5);
          doc.text(t('pdfPage') + ' ' + (p + 1) + ' ' + t('pdfOf') + ' ' + pages, W - 12, 19.5, { align: 'right' });
          doc.setDrawColor(200); doc.setLineWidth(0.2); doc.line(12, 22, W - 12, 22);

          doc.setFontSize(8); doc.setTextColor(0);
          for (var s = 0; s < perPage; s++) {
            var idx = p * perPage + s;
            if (idx >= totalSteps) break;
            var col = Math.floor(s / perCol), rowN = s % perCol;
            var x = 12 + col * colW, y = top + rowN * lineH;
            doc.setTextColor(150);
            doc.text(String(idx + 1) + '.', x, y);
            doc.setTextColor(0);
            // The core PDF fonts are WinAnsi-encoded, which has no arrow glyph.
            doc.text(seq[idx] + ' \u00BB ' + seq[idx + 1], x + 9, y);
          }
        }
        doc.save('string-art-steps.pdf');
      }

      return h('div', { className: 'row' },
        h('div', { className: 'col', style: { flex: '1 1 340px' } },
          h('div', { className: 'card' },
            h('h2', null, t('genTitle')),
            h(Field, { label: t('selectImage'), hint: t('imageHint') },
              h(DropZone, {
                title: t('dropTitle'), hint: t('dropHint'),
                errorText: t('errorNotImage'), fileName: fileName, onFile: onFile
              })),
            h(Field, { label: t('resolution') },
              h(NumberInput, { value: o.size, min: 100, max: 1200, step: 50, onChange: function (v) { set('size', v); } }))
          ),
          h('div', { className: 'card' },
            h('h2', null, t('genParams')),
            h(Check, { id: 'syncPins', checked: o.sync, label: t('syncPins'), onChange: function (v) { set('sync', v); } }),
            h(Field, { label: t('pins') },
              h('input', {
                type: 'number', value: pins, min: 8, max: 1000, disabled: o.sync,
                onChange: function (e) { set('pins', e.target.value); }
              })),
            h(Field, { label: t('linesN') },
              h(NumberInput, { value: o.lines, min: 100, max: 20000, step: 100, onChange: function (v) { set('lines', v); } })),
            h(Field, { label: t('lineWeight'), hint: t('lineWeightHint') },
              h(NumberInput, { value: o.lineWeight, min: 1, max: 100, onChange: function (v) { set('lineWeight', v); } })),
            h(Field, { label: t('minDistance'), hint: t('minDistanceHint') },
              h(NumberInput, { value: o.minDistance, min: 1, max: 200, onChange: function (v) { set('minDistance', v); } })),
            h('div', { className: 'controls' },
              h('button', { className: 'btn', onClick: start, disabled: !imgEl || running }, t('generate')),
              h('button', { className: 'btn danger', onClick: stop, disabled: !running }, t('stop')))
          ),
          seq ? h('div', { className: 'card' },
            h('h2', null, t('summaryTitle')),
            h('div', { className: 'stat' }, h('span', null, t('sLines')), h('b', null, String(seq.length - 1))),
            h('div', { className: 'stat' }, h('span', null, t('sThread')), h('b', null, n1(threadM) + ' m'))
          ) : null
        ),

        h('div', { className: 'col', style: { flex: '2 1 520px' } },
          h('div', { className: 'card' },
            h('div', { className: 'row' },
              h('div', { className: 'col' },
                h('div', { className: 'caption' }, grayed ? t('originalLabel') : t('framingLabel')),
                h('div', { className: 'canvasWrap' + (imgEl ? ' framing' : '') },
                  h('canvas', {
                    ref: srcRef,
                    onPointerDown: onPointerDown, onPointerMove: onPointerMove,
                    onPointerUp: onPointerUp, onPointerCancel: onPointerUp
                  })),
                h('div', { className: 'zoombar' },
                  h('button', {
                    type: 'button', className: 'zoombtn', disabled: !imgEl,
                    title: t('zoomOut'), 'aria-label': t('zoomOut'),
                    onClick: function () { zoom(1 / 1.25); }
                  }, '\u2212'),
                  h('span', { className: 'zoomval' }, Math.round(view.zoom * 100) + '%'),
                  h('button', {
                    type: 'button', className: 'zoombtn', disabled: !imgEl,
                    title: t('zoomIn'), 'aria-label': t('zoomIn'),
                    onClick: function () { zoom(1.25); }
                  }, '+'),
                  h('button', {
                    type: 'button', className: 'btn secondary small', disabled: !imgEl,
                    onClick: function () { setView({ zoom: 1, panX: 0, panY: 0 }); }
                  }, t('zoomFit'))
                ),
                h('div', { className: 'hint' }, t('zoomHint'))),
              h('div', { className: 'col' },
                h('div', { className: 'caption' }, t('resultLabel')),
                h('div', { className: 'canvasWrap' }, h('canvas', { ref: outRef })))
            ),
            (running || msg) ? h('div', { style: { marginTop: '14px' } },
              h('div', { className: 'progress' }, h('div', { style: { width: pct + '%' } }, pct > 8 ? pct + '%' : '')),
              h('div', { className: 'hint', style: { marginTop: '6px' } }, msg)
            ) : h('div', { className: 'hint', style: { marginTop: '14px' } }, imgEl ? '' : t('noImageYet'))
          ),

          seq ? h('div', { className: 'card' },
            h('h2', null, t('sequenceTitle')),
            h('div', { className: 'hint', style: { marginBottom: '8px' } }, t('sequenceHint')),
            h('textarea', { rows: 6, readOnly: true, value: seq.join(',') }),
            h('div', { className: 'controls', style: { marginTop: '12px' } },
              h('button', { className: 'btn secondary', onClick: copySeq }, copied ? t('copied') : t('copySeq')),
              h('button', { className: 'btn secondary', onClick: saveTxt }, t('downloadSeq')),
              h('button', { className: 'btn secondary', onClick: savePng }, t('downloadPng')),
              h('button', { className: 'btn', onClick: saveStepsPdf }, t('downloadSteps')))
          ) : null,

          runPins ? h(Preview3D, { t: t, seq: seq, pins: runPins }) : null
        )
      );
    }

    // -------------------------------------------------------------
    function App() {
      var t = useLang();
      var stTab = React.useState('generator'); var tab = stTab[0], setTab = stTab[1];
      var stPts = React.useState(288); var points = stPts[0], setPoints = stPts[1];
      var stR = React.useState(28); var radiusCm = stR[0], setRadiusCm = stR[1];

      var nPoints = Math.max(3, Math.min(2000, parseInt(points, 10) || 3));
      var nRadius = Math.max(1, Math.min(200, parseFloat(radiusCm) || 1));

      return h(React.Fragment, null,
        h('div', { className: 'tabs' },
          h('button', { className: 'tab' + (tab === 'generator' ? ' active' : ''), onClick: function () { setTab('generator'); } }, t('tabGenerator')),
          h('button', { className: 'tab' + (tab === 'template' ? ' active' : ''), onClick: function () { setTab('template'); } }, t('tabTemplate')),
          h('button', { className: 'tab' + (tab === 'ring' ? ' active' : ''), onClick: function () { setTab('ring'); } }, t('tabRing'))
        ),
        tab === 'template'
          ? h(TemplatePanel, { t: t, points: nPoints, setPoints: setPoints, radiusCm: nRadius, setRadiusCm: setRadiusCm })
          : tab === 'ring'
            ? h(RingPanel, { t: t, points: nPoints, setPoints: setPoints, radiusCm: nRadius, setRadiusCm: setRadiusCm })
            : h(GeneratorPanel, { t: t, points: nPoints, radiusCm: nRadius }),
        h('footer', null, t('footerText'))
      );
    }

    function LanguageSelector() {
      var stL = React.useState(window.__currentLanguage); var lang = stL[0], setLang = stL[1];
      var stO = React.useState(false); var isOpen = stO[0], setIsOpen = stO[1];
      var ref = React.useRef(null);
      var t = function (k) { return (window.I18N[lang] && window.I18N[lang][k]) || window.I18N.en[k] || k; };

      React.useEffect(function () {
        var close = function (e) { if (ref.current && !ref.current.contains(e.target)) setIsOpen(false); };
        document.addEventListener('mousedown', close);
        document.addEventListener('scroll', close, true);
        return function () {
          document.removeEventListener('mousedown', close);
          document.removeEventListener('scroll', close, true);
        };
      }, []);

      React.useEffect(function () {
        document.documentElement.lang = lang;
        document.title = t('title');
        document.getElementById('header-title').textContent = t('title');
        document.getElementById('header-hint').textContent = t('headerHint');
      }, [lang]);

      function change(code) {
        setLang(code); setIsOpen(false);
        window.__currentLanguage = code;
        window.__languageListeners.forEach(function (l) { l(code); });
      }

      var languages = [
        { code: 'en', flag: 'https://flagcdn.com/w20/gb.png', name: 'English' },
        { code: 'pt', flag: 'https://flagcdn.com/w20/pt.png', name: 'Português' },
        { code: 'fr', flag: 'https://flagcdn.com/w20/fr.png', name: 'Français' },
        { code: 'es', flag: 'https://flagcdn.com/w20/es.png', name: 'Español' },
        { code: 'it', flag: 'https://flagcdn.com/w20/it.png', name: 'Italiano' },
        { code: 'de', flag: 'https://flagcdn.com/w20/de.png', name: 'Deutsch' }
      ];
      var sel = languages.filter(function (l) { return l.code === lang; })[0];

      return h('div', { style: { display: 'flex', alignItems: 'center', gap: '8px' } },
        h('span', null, t('language') + ':'),
        h('div', { ref: ref, className: 'custom-select-wrapper' },
          h('button', {
            type: 'button', className: 'custom-select-button',
            onClick: function (e) { e.stopPropagation(); setIsOpen(!isOpen); }
          },
            h('span', { className: 'custom-select-label' },
              h('img', { src: sel.flag, alt: sel.code.toUpperCase(), className: 'flag-icon' }),
              h('span', null, sel.name)),
            h('svg', { xmlns: 'http://www.w3.org/2000/svg', viewBox: '0 0 20 20', fill: 'currentColor', className: 'custom-select-arrow' },
              h('path', {
                fillRule: 'evenodd', clipRule: 'evenodd',
                d: 'M5.23 7.21a.75.75 0 011.06.02L10 10.94l3.71-3.71a.75.75 0 111.06 1.06l-4.24 4.24a.75.75 0 01-1.06 0L5.21 8.29a.75.75 0 01.02-1.08z'
              }))
          ),
          isOpen ? h('div', { className: 'custom-select-menu open' },
            languages.map(function (l) {
              return h('button', {
                key: l.code, type: 'button',
                className: 'custom-select-option' + (l.code === lang ? ' selected' : ''),
                onMouseDown: function (e) { e.preventDefault(); e.stopPropagation(); change(l.code); }
              },
                h('img', { src: l.flag, alt: l.code.toUpperCase(), className: 'flag-icon' }),
                h('span', null, l.name));
            })
          ) : null
        )
      );
    }

    ReactDOM.createRoot(document.getElementById('app')).render(h(App));
    ReactDOM.createRoot(document.getElementById('language-selector')).render(h(LanguageSelector));

    var init = window.I18N[window.__currentLanguage] || window.I18N.en;
    document.title = init.title;
    document.getElementById('header-title').textContent = init.title;
    document.getElementById('header-hint').textContent = init.headerHint;
  })();
  </script>
</body>
