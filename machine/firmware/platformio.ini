; The board is an ESP32 DevKit v1. The platform is pinned because the timer and
; filesystem APIs changed with the 3.x Arduino core, and this firmware is
; written against 2.x.
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
build_flags =
	-Wall
	-DCORE_DEBUG_LEVEL=1
lib_deps =

; The geometry and the g-code reader are plain C++ so that they can be tested on
; a PC, where a failing case takes a second rather than a flash cycle.
[env:native]
platform = native
test_framework = unity
build_flags =
	-std=c++17
	-Wall
	-I src
test_ignore = test_embedded
